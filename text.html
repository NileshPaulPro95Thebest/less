<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Card</title>
  <style>

    /* Typography — font, size, weight, colour for the whole page */
    body {
      background-color: blue;
      font-family: Arial, sans-serif;
     }  
      


    /* Typography + Text Shadow — big bold title with an orange shadow */
    .hero-name {
      font-size: 60px;
      background-color: rgb(217, 0, 255);
      font-weight: bold;
      color: yellow;
      text-shadow: 3px 3px rgb(255, 136, 0);
      animation: infinite;
      box-shadow: 16px 16px 16px rgb(1, 1, 24);
    }

    /* Typography + Text Transform — tagline becomes Title Case */
    .tagline {
      font-style: italic;
      color: lightblue;
      text-transform: capitalize;
      animation: linear;
       box-shadow:5px 5px 5px rgb(1, 66, 20) ;
       background-color: brown;
    }

    /* Text Transform + Text Decoration — section headings in CAPS with underline */
    .label {
      text-transform: uppercase;
      text-decoration: underline;
      color: coral;
    }

    /* Typography — powers stand out in bold green */
    .power {
      font-weight: bold;
      color: lightgreen;
    }

    /* Text Decoration — weaknesses are crossed out */
    .weakness {
      text-decoration: line-through;
      color: gray;
      animation: cubic-bezier(0.55, 0.055, 0.675, 0.19); 
    }

    /* Transform — the badge is tilted to the side */
    .badge {
      font-size: 28px;
      font-weight: bold;
      color: gold;
      transform: rotate(15deg);
      animation: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Typography — footer text */
    .made-by {
      color: coral;
      font-style: italic;
      
    }

    .img{
        height:500px;
        width:250px;
    }

  </style>
</head>
<body  background-image: linear-gradient(to right, blue, green)>

  <h1 class="hero-name">Thunder Kid</h1>
  <p class="tagline">the most powerful hero in the school</p>

  <h2 class="label">super powers</h2>
  <p class="power">Can run faster than a cheetah</p>
  <p class="power">Can lift a school bus</p>

  <h2 class="label">weaknesses</h2>
  <p class="weakness">Maths homework</p>
  <p class="weakness">Broccoli</p>

  <p class="badge">Top Hero</p>

  <img class=img src="images.jpg">

  <p class="made-by">Created_by _Nilesh_Paul_</p>

</body>
</html>
